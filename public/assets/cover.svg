<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <rect width="1536" height="1024" fill="#f7f5f0"/>
  <rect x="0" y="0" width="1536" height="10" fill="#e5e1d6"/>
  <rect x="0" y="1014" width="1536" height="10" fill="#e5e1d6"/>
  <!-- decor: stacked reminder cards -->
  <g opacity="0.16">
    <rect x="330" y="250" width="150" height="100" rx="14" fill="#ffffff" stroke="#d8d3c6"/>
    <rect x="360" y="380" width="160" height="100" rx="14" fill="#ffffff" stroke="#d8d3c6"/>
    <rect x="1080" y="560" width="150" height="100" rx="14" fill="#ffffff" stroke="#d8d3c6"/>
  </g>
  <g transform="translate(1060 512)">
    <circle cx="0" cy="0" r="240" fill="#ffffff" stroke="#e5e1d6" stroke-width="4"/>
    <g stroke="#26241f" stroke-width="22" stroke-linecap="round">
      <line x1="0" y1="-200" x2="0" y2="-160"/>
      <line x1="0" y1="160" x2="0" y2="200"/>
      <line x1="-200" y1="0" x2="-160" y2="0"/>
      <line x1="160" y1="0" x2="200" y2="0"/>
    </g>
    <g stroke="#26241f" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-120" stroke-width="24"/>
      <line x1="0" y1="0" x2="98" y2="58" stroke-width="18"/>
    </g>
    <circle cx="0" cy="0" r="24" fill="#b4473a"/>
    <circle cx="120" cy="136" r="52" fill="none" stroke="#a8864e" stroke-width="16"/>
    <path d="M120 112 v20 l16 10" fill="none" stroke="#a8864e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- type -->
  <text x="120" y="330" font-family="Liberation Sans, sans-serif" font-size="64" font-weight="bold" letter-spacing="8" fill="#2f7e78">LIFE CLOCK</text>
  <text x="120" y="452" font-family="Liberation Sans, sans-serif" font-size="54" font-weight="bold" fill="#26241f">Everything important</text>
  <text x="120" y="526" font-family="Liberation Sans, sans-serif" font-size="54" font-weight="bold" fill="#26241f">has a next date.</text>
  <text x="120" y="614" font-family="Liberation Sans, sans-serif" font-size="30" fill="#57544a">Expirations, renewals, maintenance, warranties — remembered</text>
  <text x="120" y="664" font-family="Liberation Sans, sans-serif" font-size="30" fill="#57544a">in one simple place.</text>
  <rect x="120" y="730" width="320" height="76" rx="38" fill="#2f7e78"/>
  <text x="280" y="779" font-family="Liberation Sans, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Start tracking</text>
</svg>