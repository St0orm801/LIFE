name: LIFE signed TestFlight build
on:
  workflow_dispatch:
  push:
    branches: [codex/life-purchases]
permissions:
  contents: read
jobs:
  testflight:
    if: vars.LIFE_SIGNING_READY == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    environment: life-testflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run mobile:build
        env:
          LIFE_BUILD_ID: ios-testflight-${{ github.run_number }}
      - run: npx cap sync ios
      - name: Sign archive and upload for internal TestFlight only
        env:
          LIFE_P12_BASE64: ${{ secrets.LIFE_P12_BASE64 }}
          LIFE_P12_PASSWORD: ${{ secrets.LIFE_P12_PASSWORD }}
          LIFE_PROFILE_BASE64: ${{ secrets.LIFE_PROFILE_BASE64 }}
          LIFE_ASC_KEY_BASE64: ${{ secrets.LIFE_ASC_KEY_BASE64 }}
          LIFE_ASC_KEY_ID: ${{ secrets.LIFE_ASC_KEY_ID }}
          LIFE_ASC_ISSUER_ID: ${{ secrets.LIFE_ASC_ISSUER_ID }}
          LIFE_TEAM_ID: GA8H8TTY36
          LIFE_BUILD_NUMBER: ${{ github.run_id }}
        run: bash scripts/ios-testflight.sh
